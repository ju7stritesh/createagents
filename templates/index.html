<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .chat-container {
            height: calc(100vh - 200px);
            overflow-y: auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
            max-width: 80%;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            margin-left: auto;
        }
        .assistant-message {
            background-color: #e9ecef;
            color: #212529;
        }
        .document-item {
            background-color: #495057;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .document-item:hover {
            background-color: #6c757d;
        }
        .source {
            background-color: #f8f9fa;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        .source-text {
            margin-top: 5px;
            color: #6c757d;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loading-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 300px;
        }
        
        .loading-spinner {
            width: 3rem;
            height: 3rem;
            margin-bottom: 1rem;
        }
        
        .loading-message {
            color: #333;
            margin-bottom: 0;
        }
        
        .progress {
            height: 0.5rem;
            margin-top: 0.5rem;
        }
        .agent-creation-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .agent-creation-card {
            max-width: 500px;
            width: 100%;
        }
        .sidebar {
            height: 100vh;
            background-color: #f8f9fa;  /* Light background */
            color: #212529;  /* Dark text */
            padding: 20px;
            overflow-y: auto;
        }
        .sidebar h4 {
            color: #212529;  /* Dark text for headings */
        }
        .chunk-list {
            margin-left: 15px;
            font-size: 0.9em;
        }
        .chunk-item {
            background-color: #212529;
            margin: 5px 0;
            padding: 5px 10px;
            border-radius: 3px;
        }
        .agent-card {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            margin-bottom: 10px;
            padding: 10px;
        }
        .agent-card:hover {
            background-color: #e9ecef;
        }
        .agent-documents {
            margin-left: 20px;
            font-size: 0.9em;
        }
        .document-item {
            background-color: #e9ecef;
            margin: 5px 0;
            padding: 5px 10px;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .document-item:hover {
            background-color: #dee2e6;
        }
        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .agent-name {
            font-weight: bold;
            color: #495057;
        }
        .document-count {
            color: #6c757d;
            font-size: 0.9em;
        }
        .document-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .document-list li {
            padding: 8px 12px;
            margin: 4px 0;
            background-color: #ffffff;  /* White background */
            border: 1px solid #dee2e6;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #212529;  /* Dark text */
        }
        .document-list li:hover {
            background-color: #e9ecef;
            transform: translateX(5px);
        }
        .document-list li.active {
            background-color: #e3f2fd;
            border-color: #90caf9;
        }
        .document-list .document-name {
            flex-grow: 1;
            margin-right: 10px;
            color: #212529;  /* Dark text */
        }
        .document-list .document-actions {
            display: flex;
            gap: 8px;
        }
        .document-list .btn {
            padding: 2px 6px;
            font-size: 0.8rem;
        }
        .document-list .btn i {
            font-size: 0.8rem;
        }
        .document-list .chunk-count {
            font-size: 0.8rem;
            color: #6c757d;
            margin-left: 8px;
        }
        .document-list .document-info {
            display: flex;
            align-items: center;
            color: #212529;  /* Dark text */
        }
        .document-list .document-info i {
            margin-right: 6px;
            color: #6c757d;
        }
        .document-list .document-info span {
            color: #212529;  /* Dark text */
        }
        .document-list .document-info small {
            color: #6c757d;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner-border text-primary loading-spinner" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="loading-message" id="loadingMessage">Processing...</p>
            <div class="progress d-none" id="uploadProgress">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- AI Agent Creation Section -->
    <div id="agentCreationSection" class="agent-creation-container">
        <div class="agent-creation-card">
            <!-- Existing Agents List -->
            <div class="card mb-4">
                <div class="card-header">
                    <h4 class="mb-0">Existing Agents</h4>
                </div>
                <div class="card-body">
                    <div id="existingAgentsList" class="list-group">
                        <!-- Agents will be listed here -->
                    </div>
                </div>
            </div>

            <!-- Create New Agent -->
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Create New Agent</h4>
                </div>
                <div class="card-body">
                    <form id="agentForm">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" id="agentNameInput" placeholder="Enter AI Agent name" required>
                            <button class="btn btn-primary" type="submit">
                                <i class="fas fa-robot"></i> Create Agent
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Document Flow Section (Initially Hidden) -->
    <div id="documentFlowSection" class="d-none">
        <div class="container-fluid">
            <div class="row">
                <!-- Sidebar -->
                <div class="col-md-3 sidebar">
                    <h4 class="mb-4">Documents</h4>
                    <div class="document-list">
                        <!-- Documents will be listed here -->
                    </div>
                </div>
                
                <!-- Main Content -->
                <div class="col-md-9 main-content">
                    <div class="row mb-4">
                        <div class="col">
                            <h2>Software Flow</h2>
                        </div>
                        <div class="col-auto">
                            <a href="/" class="btn btn-info me-2">
                                <i class="fas fa-home"></i> Back to Home
                            </a>
                            <button class="btn btn-warning me-2" onclick="clearChat()">
                                <i class="fas fa-eraser"></i> Clear Chat
                            </button>
                            <button class="btn btn-danger" onclick="deleteAllDocuments()">
                                <i class="fas fa-trash"></i> Delete All
                            </button>
                        </div>
                    </div>
                    
                    <!-- File Upload -->
                    <div class="card mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Upload Document or Enter URL</h5>
                            <form id="uploadForm" class="mb-3">
                                <div class="input-group mb-3">
                                    <input type="file" class="form-control" id="fileInput" accept=".pdf,.docx,.xlsx,.csv">
                                    <button class="btn btn-primary" type="submit">
                                        <i class="fas fa-upload"></i> Upload File
                                    </button>
                                </div>
                                <div class="input-group">
                                    <input type="url" class="form-control" id="urlInput" placeholder="Enter website URL">
                                    <button class="btn btn-success" type="button" onclick="processUrl()">
                                        <i class="fas fa-globe"></i> Process URL
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                    
                    <!-- Chat Interface -->
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h4 id="agentTitle" class="mb-0">Document Assistant</h4>
                            </div>
                        </div>
                        <div class="card-body">
                            <div id="chatContainer" class="chat-container"></div>
                            <form id="chatForm" class="mt-3">
                                <div class="input-group">
                                    <input type="text" class="form-control" id="questionInput" placeholder="Ask a question...">
                                    <button class="btn btn-primary" type="submit">
                                        <i class="fas fa-paper-plane"></i> Send
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAgentId = null;
        let currentAgentName = null;

        // Function to show loading overlay
        function showLoading(message = 'Processing...') {
            const overlay = document.getElementById('loadingOverlay');
            const messageElement = document.getElementById('loadingMessage');
            if (overlay && messageElement) {
                messageElement.textContent = message;
                overlay.style.display = 'flex';
            }
        }

        // Function to hide loading overlay
        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }

        // Wait for DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize agent creation form
            const agentForm = document.getElementById('agentForm');
            if (agentForm) {
                agentForm.addEventListener('submit', function(event) {
                    event.preventDefault();
                    createAgent();
                });
            }

            // Initialize document upload form
            const uploadForm = document.getElementById('uploadForm');
            if (uploadForm) {
                uploadForm.addEventListener('submit', handleFileUpload);
            }

            // Initialize chat form
            const chatForm = document.getElementById('chatForm');
            if (chatForm) {
                chatForm.addEventListener('submit', handleChatSubmit);
            }

            // Initialize URL processing button
            const urlButton = document.querySelector('button[onclick="processUrl()"]');
            if (urlButton) {
                urlButton.addEventListener('click', handleUrlSubmit);
            }

            // Load existing agents
            loadExistingAgents();
        });

        // Function to load existing agents
        async function loadExistingAgents() {
            showLoading('Loading agents...');
            try {
                const response = await fetch('/list_agents');
                const data = await response.json();
                
                if (data.error) {
                    console.error('Error loading agents:', data.error);
                    hideLoading();
                    return;
                }

                const agentsList = document.getElementById('existingAgentsList');
                if (!agentsList) {
                    hideLoading();
                    return;
                }

                agentsList.innerHTML = '';

                if (data.length === 0) {
                    agentsList.innerHTML = '<div class="text-muted">No existing agents found</div>';
                } else {
                    data.forEach(agent => {
                        const agentElement = document.createElement('div');
                        agentElement.className = 'agent-card';
                        agentElement.innerHTML = `
                            <div class="agent-header">
                                <div>
                                    <span class="agent-name">${agent.name}</span>
                                    <span class="document-count ms-2">(${agent.document_count} documents)</span>
                                </div>
                                <div class="btn-group">
                                    <button class="btn btn-sm btn-primary" onclick="switchAgent('${agent.agent_id}', '${agent.name}')">
                                        <i class="fas fa-exchange-alt"></i> Switch
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteAgent('${agent.agent_id}', '${agent.name}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="agent-documents">
                                ${agent.documents.map(doc => `
                                    <div class="document-item">
                                        <div>
                                            <i class="fas fa-file-alt me-2"></i>
                                            <span>${doc.filename}</span>
                                            <small class="text-muted ms-2">(${doc.chunk_count} chunks)</small>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                        agentsList.appendChild(agentElement);
                    });
                }

                hideLoading();
            } catch (error) {
                console.error('Error loading agents:', error);
                hideLoading();
            }
        }

        // Function to switch agent
        async function switchAgent(agentId, agentName) {
            showLoading('Switching agent...');
            try {
                const response = await fetch('/switch_agent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ agent_id: agentId })
                });

                const data = await response.json();

                if (data.error) {
                    hideLoading();
                    alert('Error switching agent: ' + data.error);
                    return;
                }

                // Store agent information
                currentAgentId = data.agent_id;
                currentAgentName = data.name;

                // Update chat interface title
                const agentTitle = document.getElementById('agentTitle');
                if (agentTitle) {
                    agentTitle.textContent = `${currentAgentName} - Document Assistant`;
                }

                // Hide agent creation section and show document flow section
                const documentFlowSection = document.getElementById('documentFlowSection');
                const agentCreationSection = document.getElementById('agentCreationSection');
                if (documentFlowSection && agentCreationSection) {
                    documentFlowSection.classList.remove('d-none');
                    agentCreationSection.classList.add('d-none');
                }

                // Clear chat display
                const chatContainer = document.getElementById('chatContainer');
                if (chatContainer) {
                    chatContainer.innerHTML = '';
                }

                // Load documents for the new agent
                await loadDocuments();

            } catch (error) {
                console.error('Error switching agent:', error);
                hideLoading();
                alert('Error switching agent. Please try again.');
            }
        }

        // Function to check for existing documents
        async function checkExistingDocuments() {
            try {
                const response = await fetch('/list_documents');
                const data = await response.json();
                
                if (data.error) {
                    console.error('Error checking documents:', data.error);
                    return;
                }

                if (data.length > 0) {
                    // Show confirmation dialog
                    if (confirm('Existing documents found. Would you like to continue with these documents?')) {
                        // Show document flow section
                        const documentFlowSection = document.getElementById('documentFlowSection');
                        const agentCreationSection = document.getElementById('agentCreationSection');
                        if (documentFlowSection && agentCreationSection) {
                            documentFlowSection.classList.remove('d-none');
                            agentCreationSection.classList.add('d-none');
                        }
                        // Load documents
                        await loadDocuments();
                    }
                }
            } catch (error) {
                console.error('Error checking documents:', error);
            }
        }

        // Function to load documents for the current agent
        async function loadDocuments() {
            showLoading('Loading documents...');
            try {
                const response = await fetch('/list_documents');
                const data = await response.json();
                
                if (data.error) {
                    console.error('Error loading documents:', data.error);
                    hideLoading();
                    return;
                }

                const documentList = document.querySelector('.document-list');
                if (!documentList) {
                    hideLoading();
                    return;
                }

                documentList.innerHTML = '';

                if (data.length === 0) {
                    documentList.innerHTML = '<div class="text-muted">No documents found</div>';
                } else {
                    data.forEach(doc => {
                        const docElement = document.createElement('div');
                        docElement.className = 'document-item';
                        docElement.innerHTML = `
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <i class="fas fa-file-alt me-2"></i>
                                    <span>${doc.filename}</span>
                                    <small class="text-muted ms-2">(${doc.chunk_count} chunks)</small>
                                </div>
                                <button class="btn btn-sm btn-danger" onclick="deleteDocument('${doc.document_id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        `;
                        documentList.appendChild(docElement);
                    });
                }

                hideLoading();
            } catch (error) {
                console.error('Error loading documents:', error);
                hideLoading();
            }
        }

        // Function to create a new agent
        async function createAgent() {
            const agentNameInput = document.getElementById('agentNameInput');
            if (!agentNameInput) return;

            const agentName = agentNameInput.value.trim();
            if (!agentName) {
                alert('Please enter an agent name');
                return;
            }

            showLoading('Creating agent...');
            try {
                const response = await fetch('/create_agent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: agentName })
                });

                const data = await response.json();

                if (data.error) {
                    hideLoading();
                    alert('Error creating agent: ' + data.error);
                    return;
                }

                // Store agent information
                currentAgentId = data.agent_id;
                currentAgentName = data.name;

                // Update chat interface title
                const agentTitle = document.getElementById('agentTitle');
                if (agentTitle) {
                    agentTitle.textContent = `${currentAgentName} - Document Assistant`;
                }

                // Hide agent creation section and show document flow section
                const documentFlowSection = document.getElementById('documentFlowSection');
                const agentCreationSection = document.getElementById('agentCreationSection');
                if (documentFlowSection && agentCreationSection) {
                    documentFlowSection.classList.remove('d-none');
                    agentCreationSection.classList.add('d-none');
                }

                // Load any existing documents for this agent
                await loadDocuments();

            } catch (error) {
                console.error('Error creating agent:', error);
                hideLoading();
                alert('Error creating agent. Please try again.');
            }
        }

        // Function to delete a document
        async function deleteDocument(documentId) {
            if (!confirm('Are you sure you want to delete this document?')) {
                return;
            }

            showLoading('Deleting document...');
            try {
                const response = await fetch('/delete_document', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ document_id: documentId })
                });

                const data = await response.json();

                if (data.error) {
                    hideLoading();
                    alert('Error deleting document: ' + data.error);
                    return;
                }

                // Reload documents after deletion
                await loadDocuments();
                // Reload agents list to update document counts
                await loadExistingAgents();

            } catch (error) {
                console.error('Error deleting document:', error);
                hideLoading();
                alert('Error deleting document. Please try again.');
            }
        }

        // Function to handle file upload
        async function handleFileUpload(event) {
            event.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select a file');
                return;
            }

            // Show loading overlay with training message
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingMessage = document.getElementById('loadingMessage');
            loadingMessage.textContent = 'Training your agent...';
            loadingOverlay.style.display = 'flex';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (result.error) {
                    alert(result.error);
                    return;
                }

                // Add document to the list
                const documentList = document.querySelector('.document-list');
                const documentItem = document.createElement('div');
                documentItem.className = 'document-item';
                documentItem.innerHTML = `
                    <div class="document-info">
                        <span class="document-name">${result.filename}</span>
                        <span class="document-chunks">${result.chunk_count} chunks</span>
                    </div>
                    <button class="delete-document" onclick="deleteDocument('${result.document_id}')">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                documentList.appendChild(documentItem);

                // Show success message
                alert('Document uploaded successfully!');
                
                // Reload documents to ensure everything is in sync
                await loadDocuments();
            } catch (error) {
                console.error('Error:', error);
                alert('Error uploading document');
            } finally {
                // Hide loading overlay
                loadingOverlay.style.display = 'none';
            }
        }

        // Function to handle URL processing
        async function handleUrlSubmit(event) {
            event.preventDefault();
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();

            if (!url) {
                alert('Please enter a URL');
                return;
            }

            // Show loading overlay with training message
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingMessage = document.getElementById('loadingMessage');
            loadingMessage.textContent = 'Training your agent...';
            loadingOverlay.style.display = 'flex';

            try {
                const response = await fetch('/process_url', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (data.error) {
                    alert('Error processing URL: ' + data.error);
                    return;
                }

                // Reload documents after successful URL processing
                await loadDocuments();

                // Clear URL input
                urlInput.value = '';

                // Show success message
                alert('URL processed successfully!');

            } catch (error) {
                console.error('Error processing URL:', error);
                alert('Error processing URL. Please try again.');
            } finally {
                // Hide loading overlay
                loadingOverlay.style.display = 'none';
            }
        }

        // Function to handle chat submission
        async function handleChatSubmit(event) {
            event.preventDefault();
            const questionInput = document.getElementById('questionInput');
            const question = questionInput.value.trim();

            if (!question) {
                alert('Please enter a question');
                return;
            }

            showLoading('Processing your question...');
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question })
                });

                const data = await response.json();

                if (data.error) {
                    hideLoading();
                    alert('Error getting response: ' + data.error);
                    return;
                }

                // Add question to chat
                addMessageToChat('user', question);
                // Add response to chat
                addMessageToChat('assistant', data.response);

                // Clear question input
                questionInput.value = '';
                hideLoading();

            } catch (error) {
                console.error('Error getting response:', error);
                hideLoading();
                alert('Error getting response. Please try again.');
            }
        }

        // Function to clear chat history
        async function clearChat() {
            if (!confirm('Are you sure you want to clear the chat history?')) {
                return;
            }

            showLoading('Clearing chat history...');
            try {
                const response = await fetch('/clear_chat', {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.error) {
                    hideLoading();
                    alert('Error clearing chat: ' + data.error);
                    return;
                }

                // Clear chat display
                document.getElementById('chatContainer').innerHTML = '';
                hideLoading();

            } catch (error) {
                console.error('Error clearing chat:', error);
                hideLoading();
                alert('Error clearing chat. Please try again.');
            }
        }

        // Function to add a message to the chat
        function addMessageToChat(role, content) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;
            messageDiv.innerHTML = `
                <div class="message-content">
                    <strong>${role === 'user' ? 'You' : 'Assistant'}:</strong>
                    <p>${content}</p>
                </div>
            `;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Function to delete all documents
        async function deleteAllDocuments() {
            if (!confirm('Are you sure you want to delete all documents? This action cannot be undone.')) {
                return;
            }

            showLoading('Deleting all documents...');
            try {
                const response = await fetch('/delete_all_documents', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.error) {
                    hideLoading();
                    alert('Error deleting documents: ' + data.error);
                    return;
                }

                // Clear the document list
                const documentList = document.querySelector('.document-list');
                if (documentList) {
                    documentList.innerHTML = '<div class="text-muted">No documents uploaded</div>';
                }

                // Clear the chat
                const chatContainer = document.getElementById('chatContainer');
                if (chatContainer) {
                    chatContainer.innerHTML = '';
                }

                // Reload agents list to update document counts
                await loadExistingAgents();

                hideLoading();
                alert('All documents deleted successfully');

            } catch (error) {
                console.error('Error deleting all documents:', error);
                hideLoading();
                alert('Error deleting documents. Please try again.');
            }
        }

        // Function to delete an agent
        async function deleteAgent(agentId, agentName) {
            if (!confirm(`Are you sure you want to delete agent "${agentName}" and all its documents? This action cannot be undone.`)) {
                return;
            }

            showLoading('Deleting agent...');
            try {
                const response = await fetch('/delete_agent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ agent_id: agentId })
                });

                const data = await response.json();

                if (data.error) {
                    hideLoading();
                    alert('Error deleting agent: ' + data.error);
                    return;
                }

                // If we're currently using this agent, clear the current agent
                if (currentAgentId === agentId) {
                    currentAgentId = null;
                    currentAgentName = null;
                    
                    // Hide document flow section and show agent creation section
                    const documentFlowSection = document.getElementById('documentFlowSection');
                    const agentCreationSection = document.getElementById('agentCreationSection');
                    if (documentFlowSection && agentCreationSection) {
                        documentFlowSection.classList.add('d-none');
                        agentCreationSection.classList.remove('d-none');
                    }

                    // Clear the document list
                    const documentList = document.querySelector('.document-list');
                    if (documentList) {
                        documentList.innerHTML = '<div class="text-muted">No documents uploaded</div>';
                    }

                    // Clear the chat
                    const chatContainer = document.getElementById('chatContainer');
                    if (chatContainer) {
                        chatContainer.innerHTML = '';
                    }
                }

                // Reload the agents list
                await loadExistingAgents();

            } catch (error) {
                console.error('Error deleting agent:', error);
                hideLoading();
                alert('Error deleting agent. Please try again.');
            }
        }
    </script>
