<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .sidebar {
            height: 100vh;
            background-color: #343a40;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }
        .main-content {
            height: 100vh;
            padding: 20px;
            overflow-y: auto;
        }
        .chat-container {
            height: calc(100vh - 200px);
            overflow-y: auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
            max-width: 80%;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            margin-left: auto;
        }
        .assistant-message {
            background-color: #e9ecef;
            color: #212529;
        }
        .document-item {
            background-color: #495057;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .document-item:hover {
            background-color: #6c757d;
        }
        .chunk-list {
            margin-left: 15px;
            font-size: 0.9em;
        }
        .chunk-item {
            background-color: #212529;
            margin: 5px 0;
            padding: 5px 10px;
            border-radius: 3px;
        }
        .source {
            background-color: #f8f9fa;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        .source-text {
            margin-top: 5px;
            color: #6c757d;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loading-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 300px;
        }
        
        .loading-spinner {
            width: 3rem;
            height: 3rem;
            margin-bottom: 1rem;
        }
        
        .loading-message {
            color: #333;
            margin-bottom: 0;
        }
        
        .progress {
            height: 0.5rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner-border text-primary loading-spinner" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="loading-message" id="loadingMessage">Processing...</p>
            <div class="progress d-none" id="uploadProgress">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 sidebar">
                <h4 class="mb-4">Documents</h4>
                <div class="document-list">
                    <!-- Documents will be listed here -->
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-9 main-content">
                <div class="row mb-4">
                    <div class="col">
                        <h2>Software Flow</h2>
                    </div>
                    <div class="col-auto">
                        <a href="/" class="btn btn-info me-2">
                            <i class="fas fa-home"></i> Back to Home
                        </a>
                        <button class="btn btn-warning me-2" onclick="clearChat()">
                            <i class="fas fa-eraser"></i> Clear Chat
                        </button>
                        <button class="btn btn-danger" onclick="deleteAllDocuments()">
                            <i class="fas fa-trash"></i> Delete All
                        </button>
                    </div>
                </div>
                
                <!-- File Upload -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Upload Document or Enter URL</h5>
                        <form id="uploadForm" class="mb-3">
                            <div class="input-group mb-3">
                                <input type="file" class="form-control" id="fileInput" accept=".pdf,.docx,.xlsx,.csv">
                                <button class="btn btn-primary" type="submit">
                                    <i class="fas fa-upload"></i> Upload File
                                </button>
                            </div>
                            <div class="input-group">
                                <input type="url" class="form-control" id="urlInput" placeholder="Enter website URL">
                                <button class="btn btn-success" type="button" onclick="processUrl()">
                                    <i class="fas fa-globe"></i> Process URL
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Chat Interface -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h2 class="mb-0">AI Document Assistant</h2>
                        <div class="d-flex gap-2">
                            <a href="/" class="btn btn-outline-light">
                                <i class="fas fa-home"></i> Back to Home
                            </a>
                            <button class="btn btn-outline-light" onclick="clearChat()">
                                <i class="fas fa-trash"></i> Clear Chat
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="chatContainer" class="chat-container"></div>
                        <form id="chatForm" class="mt-3">
                            <div class="input-group">
                                <input type="text" class="form-control" id="questionInput" placeholder="Ask a question...">
                                <button class="btn btn-primary" type="submit">
                                    <i class="fas fa-paper-plane"></i> Send
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load documents on page load
        document.addEventListener('DOMContentLoaded', loadDocuments);
        
        // Show loading overlay
        function showLoading(message) {
            document.getElementById('loadingMessage').textContent = message;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
        
        // Hide loading overlay
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
            document.getElementById('uploadProgress').classList.add('d-none');
        }
        
        // Update loading message
        function updateLoadingMessage(message) {
            document.getElementById('loadingMessage').textContent = message;
        }
        
        // File upload handling
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            
            showLoading('Uploading document...');
            document.getElementById('uploadProgress').classList.remove('d-none');
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.error) {
                    alert(data.error);
                    return;
                }
                
                updateLoadingMessage('Processing document...');
                
                // Reload documents list
                await loadDocuments();
                
                // Clear file input
                fileInput.value = '';
                
                // Show success message
                addMessageToChat('assistant', `Document "${data.filename}" uploaded successfully with ${data.chunk_count} chunks.`);
            } catch (error) {
                console.error('Error:', error);
                alert('Error uploading file');
            } finally {
                hideLoading();
            }
        });
        
        // Chat form handling
        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const questionInput = document.getElementById('questionInput');
            const question = questionInput.value.trim();
            if (!question) return;
            
            addMessageToChat('user', question);
            questionInput.value = '';
            
            showLoading('Processing your question...');
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question })
                });
                
                const data = await response.json();
                if (data.error) {
                    addMessageToChat('assistant', `Error: ${data.error}`);
                    return;
                }
                
                addMessageToChat('assistant', data.response, data.sources);
            } catch (error) {
                console.error('Error:', error);
                addMessageToChat('assistant', 'Error processing your question');
            } finally {
                hideLoading();
            }
        });
        
        // Load documents list
        async function loadDocuments() {
            try {
                const response = await fetch('/list_documents');
                const documents = await response.json();
                
                const documentList = document.querySelector('.document-list');
                documentList.innerHTML = '';
                
                documents.forEach(doc => {
                    const docElement = document.createElement('div');
                    docElement.className = 'document-item';
                    docElement.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <i class="fas fa-file-alt"></i>
                                <span>${doc.filename}</span>
                                <small class="text-muted ms-2">(${doc.chunk_count} chunks)</small>
                            </div>
                            <button class="btn btn-sm btn-danger" onclick="deleteDocument('${doc.document_id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                    documentList.appendChild(docElement);
                });
            } catch (error) {
                console.error('Error loading documents:', error);
            }
        }
        
        // Delete document
        async function deleteDocument(docId) {
            if (!confirm('Are you sure you want to delete this document?')) return;
            
            showLoading('Deleting document...');
            
            try {
                const response = await fetch('/delete_document', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ document_id: docId })
                });
                
                const data = await response.json();
                if (data.error) {
                    alert(data.error);
                    return;
                }
                
                // Reload documents list
                await loadDocuments();
                
                // Show success message
                addMessageToChat('assistant', 'Document deleted successfully.');
            } catch (error) {
                console.error('Error:', error);
                alert('Error deleting document');
            } finally {
                hideLoading();
            }
        }
        
        // Delete all documents
        async function deleteAllDocuments() {
            if (!confirm('Are you sure you want to delete all documents?')) return;
            
            showLoading('Deleting all documents...');
            
            try {
                const response = await fetch('/list_documents');
                const documents = await response.json();
                
                let successCount = 0;
                let errorCount = 0;
                
                // Delete each document one by one
                for (const doc of documents) {
                    try {
                        const deleteResponse = await fetch('/delete_document', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ document_id: doc.document_id })
                        });
                        
                        const deleteData = await deleteResponse.json();
                        if (deleteData.error) {
                            console.error(`Error deleting document ${doc.filename}:`, deleteData.error);
                            errorCount++;
                        } else {
                            successCount++;
                        }
                    } catch (error) {
                        console.error(`Error deleting document ${doc.filename}:`, error);
                        errorCount++;
                    }
                }
                
                // Reload documents list
                await loadDocuments();
                
                // Show detailed success message
                let message = `Deleted ${successCount} document${successCount !== 1 ? 's' : ''} successfully.`;
                if (errorCount > 0) {
                    message += ` Failed to delete ${errorCount} document${errorCount !== 1 ? 's' : ''}.`;
                }
                addMessageToChat('assistant', message);
            } catch (error) {
                console.error('Error:', error);
                alert('Error deleting all documents');
            } finally {
                hideLoading();
            }
        }
        
        // Clear chat
        async function clearChat() {
            if (!confirm('Are you sure you want to clear the chat history?')) return;
            
            showLoading('Clearing chat history...');
            
            try {
                const response = await fetch('/clear_chat', {
                    method: 'POST'
                });
                
                const data = await response.json();
                if (data.error) {
                    alert(data.error);
                    return;
                }
                
                // Clear chat container
                document.getElementById('chatContainer').innerHTML = '';
                
                // Show success message
                addMessageToChat('assistant', 'Chat history cleared successfully.');
            } catch (error) {
                console.error('Error:', error);
                alert('Error clearing chat history');
            } finally {
                hideLoading();
            }
        }
        
        // Process URL
        async function processUrl() {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();
            if (!url) {
                alert('Please enter a valid URL');
                return;
            }
            
            // Basic URL validation
            try {
                new URL(url);
            } catch (e) {
                alert('Please enter a valid URL (e.g., https://example.com)');
                return;
            }
            
            showLoading('Processing website...');
            
            try {
                const response = await fetch('/process_url', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url })
                });
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to process URL');
                }
                
                // Reload documents list
                await loadDocuments();
                
                // Clear URL input
                urlInput.value = '';
                
                // Show success message
                addMessageToChat('assistant', `Website "${data.filename}" processed successfully with ${data.chunk_count} chunks.`);
            } catch (error) {
                console.error('Error:', error);
                addMessageToChat('assistant', `Error processing URL: ${error.message}`);
            } finally {
                hideLoading();
            }
        }
        
        function addMessageToChat(role, content, sources = []) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;
            
            let messageContent = `<div class="message-content">${content}</div>`;
            
            if (sources.length > 0) {
                messageContent += '<div class="sources mt-2">';
                sources.forEach(source => {
                    messageContent += `
                        <div class="source">
                            <small>Source: ${source.filename} (Page ${source.page}):</small>
                            <div class="source-text">${source.text}</div>
                        </div>
                    `;
                });
                messageContent += '</div>';
            }
            
            messageDiv.innerHTML = messageContent;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
